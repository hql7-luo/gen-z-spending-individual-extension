name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild financial analysis from the included source
        run: python src/01_finance.py
      - name: Rebuild evidence-linked actions
        run: python src/03_recommendations.py
      - name: Verify financial results and saved shopping aggregates
        run: python src/05_verify.py
